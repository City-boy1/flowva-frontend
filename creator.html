<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creator profile — FLOWVA">
    <title>Creator — FLOWVA</title>
    <script>
        (function () {
            var t = localStorage.getItem('flowva-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
    <link rel="shortcut icon" href="/assets/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Flowva" />
    <link rel="manifest" href="/assets/images/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/homepage.css">
    <link rel="stylesheet" href="css/creator.css">
</head>

<body>

    <div id="shared-navbar"></div>
    <div id="toast-container"></div>

    <main class="page-content">

        <!-- ── HERO / PROFILE HEADER ── -->
        <div class="creator-hero">
            <div class="creator-banner"></div>

            <div class="creator-profile-wrap container">
                <div class="creator-avatar-wrap">
                    <div class="avatar avatar--xl avatar--placeholder" id="creator-avatar-init"
                        style="font-size:1.6rem;border:4px solid var(--bg-base)">-</div>
                    <div class="creator-verified" title="Verified Creator">✓</div>
                </div>

                <div class="creator-info">
                    <h1 id="creator-name" class="skeleton-text">-</h1>
                    <p class="role skeleton-text" id="creator-role"></p>
                    <div class="creator-tags" id="creator-tags"></div>
                </div>

                <div class="creator-actions">
                    <button class="btn btn--ghost" id="msg-btn">💬 Message</button>
                    <button class="btn btn--primary" id="follow-btn">+ Follow</button>
                </div>
            </div>
        </div>

        <!-- ── STATS BAR ── -->
        <div class="creator-stats-bar">
            <div class="creator-stat">
                <div class="creator-stat-value skeleton-text" data-stat="templates">—</div>
                <div class="creator-stat-label">Templates</div>
            </div>
            <div class="creator-stat">
                <div class="creator-stat-value skeleton-text" data-stat="sales">—</div>
                <div class="creator-stat-label">Total Sales</div>
            </div>
            <div class="creator-stat">
                <div class="creator-stat-value skeleton-text" data-stat="rating">—</div>
                <div class="creator-stat-label">Rating</div>
            </div>
            <div class="creator-stat">
                <div class="creator-stat-value skeleton-text" data-stat="followers">—</div>
                <div class="creator-stat-label">Followers</div>
            </div>
        </div>

        <!-- ── BIO ── -->
        <div class="creator-bio">
            <p class="skeleton-text" id="creator-bio">-</p>
        </div>

        <!-- ── TABS ── -->
        <div class="creator-tabs" role="tablist">
            <button class="creator-tab active" data-tab="templates" role="tab">Templates</button>
            <button class="creator-tab" data-tab="reviews" role="tab">Reviews</button>
            <button class="creator-tab" data-tab="about" role="tab">About</button>
        </div>

        <!-- ── TAB CONTENT ── -->
        <div class="creator-content">

            <!-- Templates panel -->
            <div id="tab-templates" class="creator-tab-panel">
                <div class="template-grid" id="creator-templates-grid"></div>
            </div>

            <!-- Reviews panel — populated by JS -->
            <div id="tab-reviews" class="creator-tab-panel hidden"></div>

            <!-- About panel -->
            <div id="tab-about" class="creator-tab-panel hidden"></div>

        </div>
    </main>

    <script type="module" src="js/core/navbar.js"></script>
    <script type="module" src="js/pages/creator.js"></script>
</body>

</html>
