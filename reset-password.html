<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your FLOWVA password">
    <title>Reset Password — FLOWVA</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div id="shared-navbar"></div>
    <div id="toast-container"></div>

    <main class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">FLOWVA</a>
            <h1 class="auth-heading">Set new password</h1>
            <p class="auth-subheading">Enter a new password for your account</p>

            <form class="auth-form" id="reset-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="reset-password">New password</label>
                    <div class="password-wrap">
                        <input class="form-input" type="password" id="reset-password" name="password"
                            placeholder="New password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="pass-toggle"
                            aria-label="Toggle password visibility">👁</button>
                    </div>
                    <span class="form-error" id="pass-error" role="alert"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reset-confirm">Confirm password</label>
                    <input class="form-input" type="password" id="reset-confirm" name="confirm"
                        placeholder="Confirm new password" autocomplete="new-password" required>
                    <span class="form-error" id="confirm-error" role="alert"></span>
                </div>
                <button type="submit" class="btn btn--primary auth-submit" id="reset-submit">Reset Password</button>
            </form>

            <div class="auth-links">
                <a href="login.html">← Back to login</a>
            </div>
        </div>
    </main>

    <script type="module" src="js/core/navbar.js"></script>
    <script type="module" src="js/pages/reset-password.js"></script>
</body>

</html>
