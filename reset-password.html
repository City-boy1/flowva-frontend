<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script>
        (function () {
            var t = localStorage.getItem('flowva-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
    <link rel="shortcut icon" href="/assets/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Flowva" />
    <link rel="manifest" href="/assets/images/site.webmanifest" />
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="scene">
        <div class="scene__grain"></div>
        <div class="scene__orb scene__orb--1"></div>
        <div class="scene__orb scene__orb--2"></div>
        <div class="scene__orb scene__orb--3"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <main class="page" style="display:flex; align-items:center; justify-content:center;">
        <section class="form-panel">
            <div class="card" style="max-width:460px;">
                <a href="login.html" class="mobile-logo" style="display:block;">FLOWVA</a>

                <div class="login-card">
                    <div class="card__header" style="margin-bottom:24px;">
                        <h1 class="card__title">Set New Password</h1>
                        <p class="card__sub">Enter a new password for your account.</p>
                    </div>

                    <form class="signup-form" id="reset-form" novalidate>
                        <div class="field">
                            <label class="field__label" for="reset-password">New password</label>
                            <div class="input-wrap" style="position:relative;">
                                <span class="input-icon">
                                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24">
                                        <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor"
                                            stroke-width="1.8" />
                                        <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="1.8" />
                                    </svg>
                                </span>
                                <input class="field__input has-toggle" type="password" id="reset-password"
                                    name="password" placeholder="Min. 6 characters" autocomplete="new-password"
                                    required>
                                <button type="button" class="pass-toggle" id="pass-toggle"
                                    aria-label="Toggle password visibility"
                                    style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center;padding:4px;transition:color 0.2s;z-index:2;"
                                    onmouseover="this.style.color='var(--text-primary)'"
                                    onmouseout="this.style.color='var(--text-muted)'"></button>
                            </div>
                            <span class="field__error" id="pass-error" role="alert"></span>
                        </div>

                        <div class="field">
                            <label class="field__label" for="reset-confirm">Confirm password</label>
                            <div class="input-wrap">
                                <span class="input-icon">
                                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24">
                                        <path d="M22 11.08V12a10 10 0 11-5.93-9.14" stroke="currentColor"
                                            stroke-width="1.8" />
                                        <polyline points="22,4 12,14.01 9,11.01" stroke="currentColor"
                                            stroke-width="1.8" />
                                    </svg>
                                </span>
                                <input class="field__input" type="password" id="reset-confirm" name="confirm"
                                    placeholder="Repeat password" autocomplete="new-password" required>
                            </div>
                            <span class="field__error" id="confirm-error" role="alert"></span>
                        </div>

                        <button type="submit" class="btn-submit" id="reset-submit">
                            <span class="btn-submit__shimmer"></span>
                            <span class="btn-spinner"></span>
                            <span class="btn-text-content">Reset Password</span>
                            <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
                                <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </form>
                </div>

                <p class="login-footer" style="margin-top:20px;">
                    <a href="login.html">← Back to login</a>
                </p>
            </div>
        </section>
    </main>

    <script type="module" src="js/pages/reset-password.js"></script>
</body>

</html>
